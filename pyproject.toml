[project]
version = "0.0.0"
name = "venv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygls>=2.0,<3",
    "pyyaml~=6.0"
]

[dependency-groups]
dev = [
  "pre-commit",
  "ruff",
  "pyright",
  "pytest"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["server"]
useLibraryCodeForTypes = true

[tool.ruff]
lint.extend-select = ["I"]
